
    <div class="modal-dialog">
        <form method="post" action="#" 
                    hx-post="#"
            hx-vals='{"resume_save": ""}'
            hx-target="#resume"
            hx-swap="innerHTML"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-on="htmx:beforeRequest: startLoading();
                htmx:afterRequest: stopLoading();
                htmx:afterOnLoad: checkIfFullPage(event);closeHtmxModalButton();"
            enctype="multipart/form-data">
            {% csrf_token %}
        <div class="modal-content">
    
        <!-- Modal Header -->
        <div class="modal-header">
            <h3 class="modal-title">Upload Resume</h3>
            <button type="button" class="btn-close close-modal-btn" onclick="closeHtmxModalButton()" id="closeResumeModalButton"><i class='fas fa-times edit'></i></button>
        </div>
    
        <!-- Modal Body -->
        <div class="modal-body2">
        <div class="margin20">
        <div class="">

            <table class="modal-table">
                <tbody>
                    <tr> 

                        <td>
                        <div class="upload-box">
                        <label for="resume" id="fileLabel">Choose Resume</label>
                        <input type="file" name="resume" onchange="updateFileLabel(this)" id="resume-file" accept=".pdf,.docx" />
                        </div>
                    </tr>
                    <tr><td><b>Supported formats: PDF, DOCX up to 5MB</b></td></tr>
             </tbody>
            </table>

        </div>
        </div>
        </div>
    
        <!-- Modal Footer -->
        <div class="modal-footer">
            <button type="submit" name="resume_save" class="model-btn-save" id="">Save</button>
        </div>
    
        </div>
    </form>
    </div>

<script>
  function updateFileLabel(input) {
    const label = document.getElementById('fileLabel');
    const file = input.files[0];

    if (!file) {
      label.textContent = 'Choose File';
      return;
    }

    const allowedTypes = ['application/pdf', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document'];
    const maxSize = 5 * 1024 * 1024; // 5MB in bytes

    // Check file type
    if (!allowedTypes.includes(file.type)) {
      displayHtmxMessages('Unsupported file type. Please upload a PDF, DOC, or DOCX file.');
      input.value = ''; // clear the input
      label.textContent = 'Choose Resume';
      return;
    }

    // Check file size
    if (file.size > maxSize) {
      displayHtmxMessages('File too large. Maximum size is 5MB.');
      input.value = ''; // clear the input
      label.textContent = 'Choose Resume';
      return;
    }

    // Passed validation
    label.textContent = file.name;
  }


</script>
