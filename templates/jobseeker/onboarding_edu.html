{% load static %}
<div class="tab-pane fade in active" id="tab2default">
  <div class="col-lg-12 col-xl-12 col-md-12 col-sm-12 align-self-start align-items-start d-inline-block" style="padding-left:0px;padding-right:0px;padding-top:0px;padding-bottom:0px;width:100%">
    <div class="col-lg-12 col-xl-12 col-md-12 col-sm-12 align-self-center order-2 d-inline-block bg-white align-top align-items-start">
      <form enctype="multipart/form-data" hx-post="{% url 'job_seeker:onboarding' onboarding_id=onboarding_obj.Onbording_id page='education' %}" hx-target="#education-body" hx-swap="innerHTML">
        {% csrf_token %}
        <table class="tblassetsteps dynamictbl table table-hover" id="tblEmpFamily">
          <thead>
            <tr>
              <th width="10%">
                <label class="SideLabelBold">Education Level</label>
              </th>
              <th width="10%">
                <label class="SideLabelBold">Branch</label>
              </th>
              <th width="10%">
                <label class="SideLabelBold">Degree</label>
              </th>
              <th width="20%">
                <label class="SideLabelBold">Institute Name</label>
              </th>
              <th width="10%">
                <label class="SideLabelBold">Education Type</label>
              </th>
              <th width="20%">
                <label class="SideLabelBold">Course duration</label>
              </th>
              <th width="10%">
                <label class="SideLabelBold">Grade or Percentage</label>
              </th>
              <th width="10%">
                <label class="SideLabelBold">Proof (Mark Sheet or TC)</label>
              </th>
              <th width="10%">
                <label class="SideLabelBold">Action</label>
              </th>
            </tr>
          </thead>
          <tbody id="education-body">
            {% include 'jobseeker/htmx/onboarding_edu_table.html' %}
          </tbody>
        </table>
      </form>
      <div style="float:right">

                <a href="{% url 'job_seeker:onboarding' onboarding_id=request.resolver_match.kwargs.onboarding_id page='experience' %}" class="btn btn-primary btn-save">Next</a>
      </div>
    </div>
  </div>
</div>
