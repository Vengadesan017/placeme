<script>

{% comment %}  Setup dynamically drop down for multiple select in skills  {% endcomment %}

    function setupMultiSelect(selectId = 'multi-select-skills' , searchInputId = 'search-skills', tagsContainerId = 'selected-tags-skills', dropdownId = 'dropdown-skills', newQualInputId = 'new-skills') {
        console.log("Setup dynamically drop down");
          const select = document.querySelector(`#${selectId}`);
        const searchInput = document.querySelector(`#${searchInputId}`);
        const tagsContainer = document.querySelector(`#${tagsContainerId}`);
        const dropdown = document.querySelector(`#${dropdownId}`);
        const newQualInput = document.querySelector(`#${newQualInputId}`);

        let selectedValues = [];
        let newItems = [];

        function getOptions() {
            return Array.from(select.options);
        }

        function renderDropdown(filteredOptions = getOptions()) {
            if (searchInput !== document.activeElement && searchInput.value.trim() === "") {
                dropdown.style.display = "none";
                return;
            }

            dropdown.innerHTML = '';
            const fragment = document.createDocumentFragment();

            filteredOptions.forEach(option => {
                if (!selectedValues.includes(option.value)) {
                    const item = document.createElement('div');
                    item.className = 'dropdown-item';
                    item.textContent = option.text;
                    item.dataset.value = option.value;
                    item.addEventListener('click', () => {
                        selectExistingOption(option);
                        dropdown.style.display = "none";
                    });
                    fragment.appendChild(item);
                }
            });

            dropdown.appendChild(fragment);
            dropdown.style.display = filteredOptions.length > 0 ? "block" : "none";
        }

        function addTag(text, isNew = false, value = null) {
            const tag = document.createElement('div');
            tag.className = 'tag';
            tag.textContent = text;

            const remove = document.createElement('span');
            remove.className = 'remove-tag';
            remove.textContent = '×';
            remove.addEventListener('click', () => {
                tag.remove();
                if (isNew) {
                    newItems = newItems.filter(val => val !== text);
                    updateNewInput();
                } else {
                    const opt = select.querySelector(`option[value="${value}"]`);
                    if (opt) opt.selected = false;
                    selectedValues = selectedValues.filter(val => val !== value);
                    newItems = newItems.filter(val => val !== value);
                    updateNewInput();
                }
                renderDropdown();
            });

            tag.appendChild(remove);
            tagsContainer.appendChild(tag);
        }

        function selectExistingOption(option) {
            if (!selectedValues.includes(option.value)) {
                selectedValues.push(option.value);
                //option.selected = true;
                newItems.push(option.value);
                updateNewInput();
                addTag(option.value, false, option.value);
                renderDropdown();
            }
        }

        function selectNewOption(text) {
            if (!newItems.includes(text)) {
                newItems.push(text);
                updateNewInput();
                addTag(text, true);
            }
        }

        function updateNewInput() {
            newQualInput.value = newItems.join(',');
        }

        searchInput.addEventListener('focus', () => {
            const query = searchInput.value.toLowerCase();
            const filtered = getOptions().filter(opt => opt.text.toLowerCase().includes(query));
            renderDropdown(filtered);
        });

        searchInput.addEventListener('input', () => {
            const query = searchInput.value.toLowerCase();
            const filtered = getOptions().filter(opt => opt.text && opt.text.toLowerCase().includes(query));
            renderDropdown(filtered);
        });

        searchInput.addEventListener('keydown', function (e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                const inputValue = searchInput.value.trim();
                if (inputValue === '') return;

                const existingOption = getOptions().find(opt => opt.text.toLowerCase() === inputValue.toLowerCase());
                if (existingOption) {
                    selectExistingOption(existingOption);
                } else {
                    selectNewOption(inputValue);
                }

                searchInput.value = '';
            }
        });



        // Add a global click-outside listener only once (optimized)
searchInput.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
        e.preventDefault();
        const inputValue = searchInput.value.trim();
        if (inputValue === '') return;

        const existingOption = getOptions().find(opt => opt.text.toLowerCase() === inputValue.toLowerCase());
        if (existingOption) {
            selectExistingOption(existingOption);
        } else {
            selectNewOption(inputValue);
        }

        // Clear input and hide dropdown
        searchInput.value = '';
        dropdown.style.display = "none";
    }
});




// Prepopulate from hidden input (match against select options if possible)
const existingSkillsRaw = newQualInput.value.trim();
if (existingSkillsRaw) {
    const skillList = existingSkillsRaw
        .split(',')
        .map(s => s.trim())
        .filter(s => s !== '');

    skillList.forEach(skill => {
        const existingOption = getOptions().find(opt =>
            opt.text.toLowerCase() === skill.toLowerCase() ||
            opt.value.toLowerCase() === skill.toLowerCase()
        );

            console.log(existingOption);
        if (existingOption) {
            // Mark the option as selected
            existingOption.selected = true;

            // Add to selectedValues and tag
            if (!selectedValues.includes(existingOption.value)) {
                selectedValues.push(existingOption.value);
                newItems.push(existingOption.value);
                addTag(existingOption.value, false, existingOption.value);
            }
        } 
        else{
            // Custom/new skill
            if (!newItems.includes(skill)) {
                newItems.push(skill);
                console.log("Add new");
                addTag(skill, true);
            }
        }
    });

    updateNewInput(); // Sync hidden input
}
    }

</script>
