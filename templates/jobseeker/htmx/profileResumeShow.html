
{% if candidate.resume and candidate.resume.name %}
    <div class="resume-name1">
        <h4>Resume</h4>
        <div class="buttons-resume1">
            <a href="{{ candidate.resume.url }}" class="view-btn" title="View Resume" target="_blank">
                <i class="fas fa-eye"></i> View
            </a>
            <a href="{{ candidate.resume.url }}" class="download-btn" title="Download Resume" download>
                <i class="fas fa-download"></i> Download
            </a>
            <a href="#"
            class="update-btn"
            hx-post="#"
            hx-vals='{"get_resume_form": ""}'
            hx-target="#HtmxModal"
            hx-trigger="click"
            hx-swap="innerHTML"
            hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
            hx-on="htmx:beforeRequest: startLoading();
                htmx:afterRequest: stopLoading();
                htmx:afterOnLoad: checkIfFullPage(event);openHtmxModalButton();">
                <i class="fas fa-upload"></i> Update
            </a>
        </div>
    </div>
{% else %}
    <div class="resume-name1">
        <h4>Resume</h4>
                <div class="buttons-resume1">
                    <a href="#"
                class=" add-update-btn"
                hx-post="#"
                hx-vals='{"get_resume_form": ""}'
                hx-target="#HtmxModal"
                hx-trigger="click"
                hx-swap="innerHTML"
                hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
                hx-on="htmx:beforeRequest: startLoading();
                    htmx:afterRequest: stopLoading();
                    htmx:afterOnLoad: checkIfFullPage(event);openHtmxModalButton();">

                    <i class="fas fa-upload"></i> Add Resume
                </a>
                </div>
    </div>
{% endif %}
