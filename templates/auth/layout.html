<!DOCTYPE html>
{% load static %}
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>
      {% block title %}

      {% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    <link rel="stylesheet" href="{% static 'css/error.css' %}" />
    <script src="https://www.google.com/recaptcha/api.js" async defer></script>
  </head>
  <body>
    <div class="form-container">
      {% block content %}

      {% endblock %}
    </div>

    <div class="image-container">
      {% comment %} <img src="{% static 'img/loginForm.png' %}" alt="Right-aligned image" /> {% endcomment %}
      <div class="overlay-text">
        <div class="logo">
          <!-- change the name of logo according to your name of image (mani/vengu) -->
          <a href="{% url 'job_seeker:home' %}"><img src="{% static 'img/logo.svg' %}" alt="Placenow Logo" style="height: 20px;" /></a>
        </div>
        {% comment %} <a href="{% url 'job_seeker:home' %}"><img src="{% static 'img/logo.svg' %}" alt="Placenow Logo" style="height: 25px;" /></a> {% endcomment %}
        {% block msg %}

        {% endblock %}
      </div>
    </div>

    <script src="{% static 'js/script.js' %}" defer></script>
    <script src="{% static 'js/error.js' %}" defer></script>
  </body>
</html>
