
        <div class="modal-dialog">       
                <form
                        hx-post="#"
            hx-target="#education"
            hx-swap="innerHTML"
            hx-on="htmx:beforeRequest: startLoading();
                htmx:afterRequest: stopLoading();
                htmx:afterOnLoad: checkIfFullPage(event);closeHtmxModalButton();"
                >
                {% csrf_token %}
            <div class="modal-content">
        
            <!-- Modal Header -->
            <div class="modal-header">
                <h3 class="modal-title">Education</h3>
                <button type="button" class="btn-close close-modal-btn" id="closeEduModalButton" onclick="closeHtmxModalButton()"><i class='fas fa-times edit'></i></button>
            </div>
        
            <!-- Modal Body -->
            <div class="modal-body">
            <div class="margin20">
            <div class="">


                    <div class="form-grid">

                        <!-- Level of Education -->
                        <div class="form-group">
                            <label for="id_level" class="form-label">Level of Education</label>
                            <select class="edu-level" name="level" id="id_edu_id" required>
                                <option value="">Select Education Branch</option>
                            </select>  
                        </div>

                        <!-- Course -->
                        <div class="form-group">
                            <label for="id_course" class="form-label">Course</label>
                            <select class="edu-course" name="course" id="id_edu_id" required>
                                <option value="">Select Brance</option>

                            </select>  
                        </div>

                        <!-- Specialization -->
                        <div class="form-group">
                            <label for="id_edu_id" class="form-label">Specialization</label>
                            <select class="edu-spec" name="edu_id" id="id_edu_id"\
                            data-selected-spec="{{ education_form.initial.edu_id|default:'' }}"
                             required>
                                <option value="">Select Degree</option>

                            </select>
                        </div>

                        <!-- Institute Name -->
                        <div class="form-group">
                            <label for="id_institute" class="form-label">Institute Name</label>
                            <input type="text" id="id_institute" name="institute"
                                class="form-input"
                                placeholder="Enter your institute name"
                                value="{{ education_form.initial.institute|default_if_none:'' }}"
                                required>
                        </div>

                        <!-- Education Type -->
                        <div class="form-group">
                            <label for="id_type_id" class="form-label">Education Type</label>
                            <select name="type_id" id="id_type_id" required>
                                <option value="">Select Education Type</option>
                                {% for option in education_form.fields.type_id.queryset %}
                                    <option value="{{ option.pk }}" {% if option.pk == education_form.initial.type_id %}selected{% endif %}>
                                        {{ option }}
                                    </option>
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Grade / Score -->
                        <div class="form-group">
                            <label for="id_score" class="form-label">Grade or Percentage</label>
                            <input type="text" id="id_score" name="score"
                                class="form-input"
                                placeholder="Enter Grade like 7.1/10 or Percentage like 78.2%"
                                value="{{ education_form.initial.score|default_if_none:'' }}"
                                required>
                        </div>
                        
                        <!-- Course Duration (Start and End Year) -->
                        
                        <div class="form-group">
                            <label for="id_year_of_joining" class="form-label">Course Duration</label>
                            <div class="input-row">
                                <select id="id_year_of_passing" class="modal-half-input" name="year_of_joining" required>
                                    <option value="">Select Starting Year</option>
                                    {% for value, label in education_form.fields.year_of_joining.choices %}
                                    <option value="{{ value }}"
                                    {% if value == education_form.initial.year_of_joining %}selected{% endif %}>
                                    {{ label }}
                                </option>
                                {% endfor %}
                            </select>
                            to

                            <select id="id_year_of_passing" class="modal-half-input" name="year_of_passing" required>
                                <option value="">Select Ending Year</option>
                                {% for value, label in education_form.fields.year_of_passing.choices %}
                                <option value="{{ value }}"
                                {% if value == education_form.initial.year_of_passing %}selected{% endif %}>
                                {{ label }}
                            </option>
                            {% endfor %}
                        </select>
                        <div class="checkbox-group">
                        <label class="agreement">
                            <input type="checkbox" name="currently" id="currently"
                                {% if education_form.initial.currently %}checked{% endif %}>
                            I am currently pursuing this degree
                        </label>
                        </div>
                    </div>
                </div>
            </div>


            </div>
            </div>
            </div>
        
            <!-- Modal Footer -->
            <div class="modal-footer">
                {% comment %} <button type="submit" name="profile_education_create" class="model-btn-save" id="">Save</button> {% endcomment %}
                <button type="submit" 
                
                    name="education_save"
                class="model-btn-save"
                    value="{{ education_form.instance.edu_map_id|default:'' }}"
                    hx-include="this"
                >Save</button>
                {% if education_form.instance.edu_map_id %}
                
                <button type="submit" 
                    formnovalidate
                    name="education_delete"
                class="model-btn-delete"
                    value="{{ education_form.instance.edu_map_id|default:'' }}"
                    hx-include="this"
                >Delete</button>
                {% endif %}

            </div>
        
            </div>
        </form>
        </div>

        
<script>

function setupDropdowns() {
    console.log("setupDropdowns");
    const levels = JSON.parse(document.getElementById('level-data').textContent);
    const courses = JSON.parse(document.getElementById('course-data').textContent);
    const specs = JSON.parse(document.getElementById('spec-data').textContent);

    const levelSelect = document.querySelector('.edu-level');
    const courseSelect = document.querySelector('.edu-course');
    const specSelect = document.querySelector('.edu-spec');

    if (!levelSelect || !courseSelect || !specSelect) {
        console.warn("Dropdown(s) not found: setupDropdowns() aborted");
        return;
    }

    if (specSelect.dataset.selectedSpec){
        const selectedSpecId = parseInt(specSelect.dataset.selectedSpec || 0);
        populateDropdownsFromSpecId( selectedSpecId, levels, courses, specs);
    }

    function clearOptions(select) {
        select.innerHTML = '<option value="">Select</option>';
    }


        clearOptions(levelSelect);
        levels.forEach(level => {
            const option = new Option(level.name, level.level_id);
            levelSelect.add(option);
        });


    // When Level changes
    levelSelect.addEventListener('change', function () {
        const selectedLevelId = parseInt(this.value);
        clearOptions(courseSelect);
        clearOptions(specSelect);

        const filteredCourses = courses.filter(c => c.level_id === selectedLevelId);
        filteredCourses.forEach(course => {
            const option = new Option(course.name, course.course_id);
            courseSelect.add(option);
        });
    });

    // When Course changes
    courseSelect.addEventListener('change', function () {
        const selectedCourseId = parseInt(this.value);
        clearOptions(specSelect);

        const filteredSpecs = specs.filter(s => s.course_id === selectedCourseId);
        filteredSpecs.forEach(spec => {
            const option = new Option(spec.name, spec.specification_id);
            specSelect.add(option);
        });
    });
}


// Utility function to safely set a select's value after DOM render
function forceSelectValue(select, value) {
    setTimeout(() => {
        const strValue = value.toString();
        select.value = strValue;

        if (select.value !== strValue) {
            [...select.options].forEach((opt, i) => {
                if (opt.value === strValue) {
                    select.selectedIndex = i;
                }
            });
        }

        console.log(`Value set on <select name="${select.name}">:`, select.value);
    }, 0);
}

function populateDropdownsFromSpecId( selectedSpecId, levels, courses, specs) {
        console.log("populateDropdownsFromSpecId");
    const levelSelect = document.querySelector('.edu-level');
    const courseSelect = document.querySelector('.edu-course');
    const specSelect = document.querySelector('.edu-spec');

    if (!levelSelect || !courseSelect || !specSelect) {
        console.warn("Missing dropdown(s) in form row", formRow);
        return;
    }

    selectedSpecId = parseInt(selectedSpecId);
    let selectedCourseId = 0;
    let selectedLevelId = 0;

    // Reverse lookup: spec → course → level
    const selectedSpec = specs.find(s => parseInt(s.specification_id) === selectedSpecId);
    if (selectedSpec) {
        selectedCourseId = parseInt(selectedSpec.course_id);
        const selectedCourse = courses.find(c => parseInt(c.course_id) === selectedCourseId);
        if (selectedCourse) {
            selectedLevelId = parseInt(selectedCourse.level_id);
        }
    }

    console.log("Spec ID:", selectedSpecId);
    console.log("Course ID:", selectedCourseId);
    console.log("Level ID:", selectedLevelId);

    function clearOptions(select) {
        select.innerHTML = '<option value="">Select</option>';
    }

    // 🟩 Populate Levels
    clearOptions(levelSelect);
    levels.forEach(level => {
        const option = new Option(level.name, level.level_id.toString());
        levelSelect.add(option);
    });
    forceSelectValue(levelSelect, selectedLevelId);

    // 🟦 Populate Courses based on selected level
    clearOptions(courseSelect);
    const filteredCourses = courses.filter(c => parseInt(c.level_id) === selectedLevelId);
    filteredCourses.forEach(course => {
        const option = new Option(course.name, course.course_id.toString());
        courseSelect.add(option);
    });
    forceSelectValue(courseSelect, selectedCourseId);

    // 🟨 Populate Specs based on selected course
    clearOptions(specSelect);
    const filteredSpecs = specs.filter(s => parseInt(s.course_id) === selectedCourseId);
    filteredSpecs.forEach(spec => {
        const option = new Option(spec.name, spec.specification_id.toString());
        specSelect.add(option);
    });
    forceSelectValue(specSelect, selectedSpecId);

    // 🔄 Setup change events for cascading dropdown updates
    levelSelect.onchange = function () {
        const newLevelId = parseInt(this.value);
        clearOptions(courseSelect);
        clearOptions(specSelect);

        const updatedCourses = courses.filter(c => parseInt(c.level_id) === newLevelId);
        updatedCourses.forEach(course => {
            const option = new Option(course.name, course.course_id.toString());
            courseSelect.add(option);
        });
    };

    courseSelect.onchange = function () {
        const newCourseId = parseInt(this.value);
        clearOptions(specSelect);

        const updatedSpecs = specs.filter(s => parseInt(s.course_id) === newCourseId);
        updatedSpecs.forEach(spec => {
            const option = new Option(spec.name, spec.specification_id.toString());
            specSelect.add(option);
        });
    };
}



</script>
