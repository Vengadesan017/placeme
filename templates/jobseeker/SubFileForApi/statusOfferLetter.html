
<!-- The Modal for ==========Accept Offer letter ===================== -->
<div class="modal" id="OfferLetterModal">
    <div class="modal-dialog" style="width: 70%;">
            <form method="post" action="#">
                {% csrf_token %}
        <div class="modal-content">
    
        <!-- Modal Header -->
        <div class="modal-header">
            <h3 class="modal-title">View Your Offer letter</h3>
            <div>
                                        {% comment %} <a href="{{ job_status.offer_id.offer_letter.url }}" download class="model-btn-save" title="Download">
                            <i class="fa-solid fa-download"></i>
                        </a> {% endcomment %}
                        <button type="button" class="btn-close close-modal-btn" id="closePersonalModalButton"><i class='fas fa-times edit'></i></button>
            </div>
        </div>
    
        <!-- Modal Body -->
        <div class="modal-body">
        <div class="margin20">
        <div class="" style="width: 100%; height: 450px; overflow: hidden; border-radius: 10px;">

    <iframe 
        src="{{ job_status.offer_id.offer_letter.url }}#view=FitH&toolbar=0&navpanes=0&scrollbar=0" 
        style="width: 100%; height: 100%; border: none;" 
        title="Offer Letter">
    </iframe>


        </div>
        </div>
        </div>
    
        <!-- Modal Footer -->
        <div class="modal-footer">
                        <a href="{{ job_status.offer_id.offer_letter.url }}" download class="model-btn-save" title="Download">
                            <i class="fa-solid fa-download"></i> Download
                        </a>


        </div>
    
        </div>
    </form>
    </div>
    </div>
