
        <div class="modal-dialog">
            <form method="post" action="#">
                {% csrf_token %}
            <div class="modal-content">
        
            <!-- Modal Header -->
            <div class="modal-header">
                <h3 class="modal-title">Skills</h3>
                <button type="button" class="btn-close close-modal-btn" id="closeSkillEditModalButton"  onclick="closeHtmxModalButton()"><i class='fas fa-times edit'></i></button>
            </div>
        
            <!-- Modal Body -->
            <div class="modal-body">
            <div class="margin20">
            <div class="">
                <table class="modal-table">
                    {% comment %} <div class="key-list">
                        <div class="key-list-div">
                            <ul class="key-list-ul" id="keyUl">
                                {% if skills_list %}
                                {% for skill in skills_list %}
                                {% if skill %}                                
                                <li class="key-list-li">
                                    {{ skill }}

                                </li>
                                {% else %}
                                {% endif%}
                                {% endfor %}
                                {% else %}
                                <li class="key-list-li">
                                    No skills provided,
                                   <a href="">Add key skills</a>
                                </li>
                                {% endif %}
                                
                            </ul>
                        </div>
                    </div> {% endcomment %}
                    <tr> 

                        <td>    <div class="hieght">


                            <div class="multi-select-container admin-input" id="skills-wrapper">
                                <div class="selected-tags" id="selected-tags-skills"></div>
                                <div>

                                    <input type="text" class="search-input" id="search-skills" placeholder="Search or add your Key Skills..." autocomplete="off">
                                    <div class="dropdown-list" id="dropdown-skills"></div>

                                </div>
                            </div>  
                            <select name="skills" id="multi-select-skills" hidden multiple>
                                {% for skill in skills %}
                                    <option value="{{ skill.skill }}">
                                        {{ skill }}
                                    </option>
                                {% endfor %}
                            </select>           
                                    <input type="hidden" name="skill" id="new-skills" value="{{my_skills|default:''}}"> 
                        </div>
                        </td>
                    </tr>


                </table>

            </div>
            </div>
            </div>
        
            <!-- Modal Footer -->
            <div class="modal-footer">
            <button type="submit" name="skill_save" class="model-btn-save"
                hx-post="#"
                hx-vals='{"skill_save": ""}'
                hx-target="#skills"
                hx-swap="innerHTML"
                hx-on="htmx:beforeRequest: startLoading();
                    htmx:afterRequest: stopLoading();
                    htmx:afterOnLoad: checkIfFullPage(event);closeHtmxModalButton();"                
                >Save</button>
            </div>
        
            </div>
        </form>

        </div>
