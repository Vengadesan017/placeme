
        <div class="modal-dialog">       
                <form
                        hx-post="#"
            hx-target="#employment"
            hx-swap="innerHTML"
            hx-on="htmx:beforeRequest: startLoading();
                htmx:afterRequest: stopLoading();
                htmx:afterOnLoad: checkIfFullPage(event);closeHtmxModalButton();"
                >
                {% csrf_token %}
            <div class="modal-content">
        
            <!-- Modal Header -->
            <div class="modal-header">
                <h3 class="modal-title">Employment</h3>
                <button type="button" class="btn-close close-modal-btn" id="closeEduModalButton" onclick="closeHtmxModalButton()"><i class='fas fa-times edit'></i></button>
            </div>
        
            <!-- Modal Body -->
            <div class="modal-body">
            <div class="margin20">
            <div class="">

<div class="form-grid">

    <!-- Company Name -->
    <div class="form-group">
        <label for="id_company_name" class="form-label">Company Name</label>
        <input type="text" name="company_name" id="id_company_name"
            class="form-input"
            placeholder="Enter the company name"
            value="{{ employment_form.initial.company_name|default_if_none:'' }}"
            required />
    </div>

    <!-- Designation -->
    <div class="form-group">
        <label for="id_company_role" class="form-label">Designation</label>
        <input type="text" name="company_role" id="id_company_role"
            class="form-input"
            placeholder="Enter your Designation"
            value="{{ employment_form.initial.company_role|default_if_none:'' }}"
            required />
    </div>

    <!-- Work Type -->
    <div class="form-group">
        <label for="id_type_id" class="form-label">Work Type</label>
        <select name="type_id" id="id_type_id" class="form-input" required>
            <option value="">Select Work Type</option>
            {% for option in employment_form.fields.type_id.queryset %}
                <option value="{{ option.pk }}"
                    {% if option.pk == employment_form.initial.type_id %}selected{% endif %}>
                    {{ option }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- Time Period -->
    <div class="form-group">
        <label for="id_doj" class="form-label">Employment Period</label>
        <div class="input-row">
            <input type="month" name="doj" id="id_doj"
                class="modal-half-input"
                placeholder="Enter DOJ"
                value="{{ employment_form.initial.doj|date:'Y-m'|default_if_none:'' }}" />
            to
            <input type="month" name="dol" id="id_dol"
                class="modal-half-input"
                placeholder="Enter DOL"
                value="{{ employment_form.initial.dol|date:'Y-m'|default_if_none:'' }}" />
        </div>
        <div class="checkbox-group">
            <label class="agreement">
                <input type="checkbox" name="currently" id="currently"
                    {% if employment_form.initial.currently %}checked{% endif %}>
                I am currently working here
            </label>
        </div>
    </div>

    <!-- Reason for Leaving -->
    <div class="form-group">
        <label for="id_reason_for_leaving" class="form-label">Reason for Leaving</label>
        <input type="text" name="reason_for_leaving" id="id_reason_for_leaving"
            class="form-input"
            placeholder="Reason for leaving job"
            value="{{ employment_form.initial.reason_for_leaving|default_if_none:'' }}" />
    </div>

</div>

            </div>
            </div>
            </div>
        
            <!-- Modal Footer -->
            <div class="modal-footer">
                {% comment %} <button type="submit" name="profile_education_create" class="model-btn-save" id="">Save</button> {% endcomment %}
                <button type="submit" 
                
                name="employment_save"
                class="model-btn-save"
                value="{{ employment_form.instance.work_company_id|default:'' }}"
                hx-include="this"
                >Save</button>
                {% if employment_form.instance.work_company_id %}
                
                <button type="submit" 
                    formnovalidate
                    name="employment_delete"
                class="model-btn-delete"
                    value="{{ employment_form.instance.work_company_id|default:'' }}"
                    hx-include="this"
                >Delete</button>
                {% endif %}

            </div>
        
            </div>
        </form>
        </div>
